name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, test, image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (surefire) + integration tests with Testcontainers (failsafe).
      # ubuntu-latest has Docker, so Testcontainers just works.
      - name: mvn verify
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Build Docker image
        run: docker build -t claimflow:${{ github.sha }} .

  helm:
    name: Helm lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm 3
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: helm lint deploy/helm/claimflow

      - name: helm template
        run: helm template claimflow deploy/helm/claimflow > /dev/null

      - name: helm unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest
          helm unittest deploy/helm/claimflow
