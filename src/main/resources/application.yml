spring:
  application:
    name: claimflow
  datasource:
    # Local defaults. Override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:postgresql://localhost:5432/claimflow
    username: claimflow
    password: claimflow
  jpa:
    # Flyway owns the schema. Hibernate never changes tables.
    hibernate:
      ddl-auto: none
    # Don't keep DB sessions open during view rendering.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads lazy collections in batches to avoid N+1 queries.
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

claimflow:
  fraud:
    early-claim-days: 7
    frequency-max-claims: 3
    frequency-window-days: 30
    late-reporting-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness for Kubernetes.
      probes:
        enabled: true
      group:
        # Not ready if the database is down. Liveness ignores the DB on purpose,
        # so a DB outage doesn't make Kubernetes restart every pod.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets so Prometheus can compute p95/p99.
      percentiles-histogram:
        claims.fraud.assessment: true

info:
  app:
    name: claimflow
    description: P&C insurance claims processing service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema). MDC values like claimNumber are included.
      console: ecs
