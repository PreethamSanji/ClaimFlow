# Local dev: Postgres + the app.
#   docker compose up -d postgres   -> only the database (run the app from your IDE)
#   docker compose up --build       -> database + app
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimflow
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: claimflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimflow -d claimflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claimflow
      SPRING_DATASOURCE_USERNAME: claimflow
      SPRING_DATASOURCE_PASSWORD: claimflow
    ports:
      - "8080:8080"

volumes:
  pgdata:
